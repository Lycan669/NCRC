<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCAP Analyzer Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2>📡 PCAP Analyzer Pro</h2>
      
      <div class="upload-zone">
        <div class="upload-box">
          <input type="file" id="pcap-upload" accept=".pcap,.pcapng" style="display:none;">
          <label for="pcap-upload" class="upload-label">
            ⬆️ Drag & Drop PCAP ici<br>ou cliquez pour parcourir
          </label>
        </div>

        <!-- 🆕 BOUTON EXEMPLE -->
        <button id="load-sample-btn" class="btn-primary">
          📦 Charger un Exemple
        </button>
      </div>

      <div class="options">
        <h3>⚙️ Options</h3>
        <label>
          <input type="checkbox" id="deep-inspection" checked>
          Deep Packet Inspection
        </label>
        <label>
          <input type="checkbox" id="geoip-lookup" checked>
          GéoIP Lookup
        </label>
        <label>
          <input type="checkbox" id="threat-intel" checked>
          Threat Intelligence
        </label>
        <label>
          <input type="checkbox" id="anomaly-detect" checked>
          Détection d'anomalies
        </label>
      </div>

      <button id="export-btn" class="btn-secondary">📊 Exporter Rapport</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div id="dashboard" class="dashboard" style="display: none;">
        <!-- Dashboard sera rempli par JS -->
      </div>

      <div id="loading" class="loading" style="display: none;">
        <p>Analyse en cours...</p>
        <div class="spinner"></div>
      </div>

      <div id="error" class="error" style="display: none;"></div>
    </main>
  </div>

  <!-- 🆕 CHARGER sample-data.js AVANT app.js -->
  <script src="sample-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
