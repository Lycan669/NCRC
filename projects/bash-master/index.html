<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bash Master | NCRC</title>
<style>
  :root{
    --bg:#0a0e0f;
    --panel:#111817;
    --border:#1f2c2a;
    --green:#00ff9c;
    --gold:#ffd166;
    --text:#d7e0de;
    --muted:#8aa39d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Consolas','Courier New',monospace;
    padding-bottom:60px;
  }
  header{
    padding:30px 20px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#0d1413,#0a0e0f);
  }
  header h1{
    color:var(--green);
    font-size:2.2rem;
    margin:0 0 8px;
    text-shadow:0 0 10px rgba(0,255,156,0.4);
  }
  header p{color:var(--muted);margin:0;}
  a.back{
    display:inline-block;
    margin-top:15px;
    color:var(--gold);
    text-decoration:none;
    border:1px solid var(--gold);
    padding:6px 14px;
    border-radius:6px;
    font-size:0.85rem;
  }
  a.back:hover{background:var(--gold);color:#000;}

  .search-wrap{
    max-width:600px;
    margin:25px auto;
    padding:0 20px;
  }
  #search{
    width:100%;
    padding:14px 18px;
    font-size:1rem;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    font-family:inherit;
  }
  #search:focus{outline:none;border-color:var(--green);}
  #count{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-bottom:10px;
  }

  .category{
    max-width:1100px;
    margin:0 auto 10px;
    padding:0 20px;
  }
  .category h2{
    color:var(--gold);
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
    margin-top:40px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
    margin-top:16px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
    transition:0.2s;
  }
  .card:hover{
    border-color:var(--green);
    transform:translateY(-2px);
  }
  .card h3{
    color:var(--green);
    margin:0 0 8px;
    font-size:1.1rem;
  }
  .card p{
    color:var(--text);
    font-size:0.88rem;
    margin:0 0 10px;
    line-height:1.4;
  }
  .card code{
    display:block;
    background:#000;
    color:#7fffd4;
    padding:8px 10px;
    border-radius:5px;
    font-size:0.82rem;
    overflow-x:auto;
    margin-bottom:8px;
  }
  .card .soc{
    font-size:0.78rem;
    color:var(--gold);
    border-left:2px solid var(--gold);
    padding-left:8px;
  }
  .hidden{display:none;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<header>
  <h1>💻 BASH MASTER</h1>
  <p>Guide de commandes Linux orienté SOC / Blue Team / Pentest</p>
  <a href="../projects.html" class="back">← Retour aux projets</a>
</header>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Rechercher une commande... (ex: grep, find, chmod)">
  <div id="count"></div>
</div>

<div id="commands-container"></div>

<script>

  {name:"readlink -f", desc:"Résoudre chemin absolu réel.", ex:"readlink -f script.sh", soc:"Vérifier la vraie cible d'un lien suspect."},

  {name:"uptime", desc:"Temps depuis dernier boot.", ex:"uptime", soc:"Corréler avec horaire suspecté de compromission."},

  {name:"history", desc:"Historique des commandes.", ex:"history | grep wget", soc:"Retracer actions d'un attaquant sur le shell."},

  {name:"strings", desc:"Extraire chaînes lisibles d'un binaire.", ex:"strings malware.bin | less", soc:"Analyse statique rapide d'un exécutable suspect."},
  {name:"file", desc:"Identifier type de fichier réel.", ex:"file suspicious.exe", soc:"Détecter fichier déguisé (extension trompeuse)."},

const container = document.getElementById('commands-container');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
let totalCommands = 0;

function render(filter=""){
  container.innerHTML = "";
  let visibleCount = 0;
  totalCommands = 0;

  data.forEach(section=>{
    totalCommands += section.cmds.length;
    const filtered = section.cmds.filter(c=>
      c.name.toLowerCase().includes(filter) ||
      c.desc.toLowerCase().includes(filter)
    );
    if(filtered.length === 0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `<h2>${section.cat}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach(c=>{
      visibleCount++;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${c.name}</h3>
        <p>${c.desc}</p>
        <code>${c.ex}</code>
        <div class="soc">🛡️ ${c.soc}</div>
      `;
      grid.appendChild(card);
    });

    catDiv.appendChild(grid);
    container.appendChild(catDiv);
  });

  countEl.textContent = filter 
    ? `${visibleCount} commande(s) trouvée(s) sur ${totalCommands}`
    : `${totalCommands} commandes disponibles`;
}

searchInput.addEventListener('input', e=>{
  render(e.target.value.toLowerCase().trim());
});

document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape'){
    searchInput.value = "";
    render();
    searchInput.blur();
  }
});

render();
</script>

</body>
</html>
