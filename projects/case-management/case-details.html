<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Details - Case Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .details-container {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .case-title-section {
            border-bottom: 2px solid rgba(52, 152, 219, 0.3);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .case-title-section h1 {
            font-size: 2em;
            color: #3498db;
            margin-bottom: 10px;
        }

        .title-description {
            color: #bdc3c7;
            font-size: 1.1em;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .metadata-item {
            display: flex;
            flex-direction: column;
        }

        .metadata-label {
            font-size: 0.85em;
            color: #95a5a6;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metadata-value {
            font-size: 1.1em;
            color: #ecf0f1;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.5em;
            color: #ecf0f1;
            margin: 30px 0 20px 0;
            padding-bottom: 10px;
            border-left: 5px solid var(--secondary);
            padding-left: 15px;
        }

        .checklist {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: rgba(52, 73, 94, 0.5);
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid var(--secondary);
            transition: all 0.3s ease;
        }

        .checklist-item.completed {
            border-left-color: var(--success);
            background: rgba(39, 174, 96, 0.1);
        }

        .checklist-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: var(--secondary);
        }

        .checklist-label {
            flex: 1;
            color: #ecf0f1;
            font-weight: 500;
        }

        .checklist-icon {
            font-size: 1.3em;
        }

        .findings-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
            margin-bottom: 20px;
        }

        .finding-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(149, 165, 166, 0.2);
            display: flex;
            justify-content: space-between;
        }

        .finding-item:last-child {
            border-bottom: none;
        }

        .finding-label {
            color: #95a5a6;
            font-weight: bold;
        }

        .finding-value {
            color: #ecf0f1;
        }

        .evidence-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .evidence-item {
            background: rgba(52, 152, 219, 0.2);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--secondary);
            color: #ecf0f1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .timeline {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .timeline-item {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            padding-left: 30px;
        }

        .timeline-item:before {
            content: '';
            position: absolute;
            left: 0;
            width: 20px;
            height: 20px;
            background: var(--secondary);
            border-radius: 50%;
            top: 0;
        }

        .timeline-item:after {
            content: '';
            position: absolute;
            left: 9px;
            top: 20px;
            width: 2px;
            height: calc(100% + 20px);
            background: rgba(52, 152, 219, 0.3);
        }

        .timeline-item:last-child:after {
            display: none;
        }

        .timeline-time {
            color: var(--secondary);
            font-weight: bold;
            min-width: 120px;
        }

        .timeline-content {
            color: #bdc3c7;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid rgba(52, 152, 219, 0.3);
        }

        .btn {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-back {
            background: rgba(52, 73, 94, 0.8);
            color: #ecf0f1;
            border: 2px solid #95a5a6;
        }

        .btn-back:hover {
            background: #34495e;
            border-color: #ecf0f1;
        }

        .btn-report {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-report:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-edit {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        .btn-edit:hover {
            background: linear-gradient(135deg, #e67e22, #d35400);
            box-shadow: 0 6px 15px rgba(243, 156, 18, 0.3);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            color: white;
        }

        .badge-critical {
            background: var(--critical);
        }

        .badge-high {
            background: var(--high);
        }

        .badge-medium {
            background: var(--medium);
        }

        .badge-low {
            background: var(--low);
        }

        .badge-active {
            background: var(--secondary);
        }

        .badge-closed {
            background: var(--success);
        }

        .badge-escalated {
            background: var(--danger);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-content">
                <h1>🛡️ CASE MANAGEMENT SYSTEM</h1>
                <p class="subtitle">SOC Incident & Investigation Management Platform</p>
            </div>
        </header>

        <!-- NAV -->
        <nav class="nav-bar">
            <a href="index.html" class="nav-item">📋 Dashboard</a>
            <a href="create-case.html" class="nav-item">➕ Create Case</a>
            <a href="../playbooks/index.html" class="nav-item">📖 Playbooks</a>
        </nav>

        <!-- CASE DETAILS -->
        <div class="details-container" id="case-details-container">
            <!-- Chargé par JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('id');
            
            if (caseId) {
                loadCaseDetails(caseId);
            }
        });

        function loadCaseDetails(caseId) {
            let cases = JSON.parse(localStorage.getItem('cases')) || [];
            const caseData = cases.find(c => c.caseId === caseId);

            if (!caseData) {
                document.getElementById('case-details-container').innerHTML = `
                    <div class="empty-state">
                        <h3>Case not found</h3>
                        <p>The case you're looking for doesn't exist.</p>
                        <a href="index.html" class="btn-primary">Back to Dashboard</a>
                    </div>
                `;
                return;
            }

            displayCaseDetails(caseData);
        }

        function displayCaseDetails(caseData) {
            const container = document.getElementById('case-details-container');
            const duration = calculateDuration(caseData.created, caseData.closed);

            let htmlContent = `
                <div class="case-title-section">
                    <h1>${caseData.caseId}</h1>
                    <p class="title-description">${caseData.title}</p>
                </div>

                <div class="metadata-grid">
                    <div class="metadata-item">
                        <div class="metadata-label">Type</div>
                        <div class="metadata-value">${caseData.type}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Severity</div>
                        <div class="metadata-value">
                            <span class="badge badge-${caseData.severity.toLowerCase()}">
                                ${caseData.severity}
                            </span>
                        </div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Status</div>
                        <div class="metadata-value">
                            <span class="badge badge-${caseData.status.toLowerCase()}">
                                ${caseData.status}
                            </span>
                        </div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Created</div>
                        <div class="metadata-value">${caseData.created}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Source IP</div>
                        <div class="metadata-value">${caseData.sourceIp}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Target User</div>
                        <div class="metadata-value">${caseData.targetUser}</div>
                    </div>
                    ${caseData.closed ? `
                    <div class="metadata-item">
                        <div class="metadata-label">Closed</div>
                        <div class="metadata-value">${caseData.closed}</div>
                    </div>
                    <div class="metadata-item">
                        <div class="metadata-label">Duration</div>
                        <div class="metadata-value">${duration}</div>
                    </div>
                    ` : ''}
                </div>

                <h2 class="section-title">📋 Investigation Checklist</h2>
                <div class="checklist">
            `;

            const checklistItems = [
                { key: 'detection', label: 'Detection', icon: '🔍' },
                { key: 'investigation', label: 'Investigation', icon: '🔬' },
                { key: 'containment', label: 'Containment', icon: '🛡️' },
                { key: 'recovery', label: 'Recovery', icon: '✅' }
            ];

            checklistItems.forEach(item => {
                const isCompleted = caseData.checklist && caseData.checklist[item.key];
                htmlContent += `
                    <div class="checklist-item ${isCompleted ? 'completed' : ''}">
                        <span class="checklist-icon">${isCompleted ? '✅' : '⭕'}</span>
                        <label class="checklist-label">${item.icon} ${item.label}</label>
                    </div>
                `;
            });

            htmlContent += `
                </div>

                <h2 class="section-title">🔍 Findings</h2>
                <div class="findings-box">
            `;

            if (caseData.findings) {
                Object.entries(caseData.findings).forEach(([key, value]) => {
                    const displayKey = key.replace(/_/g, ' ').toUpperCase();
                    let displayValue = value;
                    if (typeof value === 'boolean') {
                        displayValue = value ? '✅ Yes' : '❌ No';
                    }
                    htmlContent += `
                        <div class="finding-item">
                            <span class="finding-label">${displayKey}</span>
                            <span class="finding-value">${displayValue}</span>
                        </div>
                    `;
                });
            }

            htmlContent += `
                </div>

                <h2 class="section-title">📁 Evidence Files</h2>
                <div class="findings-box">
                    <div class="evidence-list">
            `;

            if (caseData.evidence && caseData.evidence.length > 0) {
                caseData.evidence.forEach(file => {
                    htmlContent += `
                        <div class="evidence-item">
                            📄 ${file}
                        </div>
                    `;
                });
            } else {
                htmlContent += '<p style="color: #95a5a6;">No evidence files attached</p>';
            }

            htmlContent += `
                    </div>
                </div>

                <h2 class="section-title">⏰ Timeline</h2>
                <div class="timeline">
                    <div class="timeline-item">
                        <div class="timeline-time">${caseData.created}</div>
                        <div class="timeline-content">Case created and investigation started</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-time">${caseData.created}</div>
                        <div class="timeline-content">Detection confirmed via SIEM query</div>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-time">${caseData.closed || 'In Progress'}</div>
                        <div class="timeline-content">Investigation ${caseData.status === 'CLOSED' ? 'completed' : 'ongoing'}</div>
                    </div>
                </div>

                <h2 class="section-title">📚 Related Playbook</h2>
                <div class="findings-box">
                    <a href="../playbooks/${caseData.playbook}.html" style="color: var(--secondary); text-decoration: none;">
                        📖 View ${caseData.type} Playbook →
                    </a>
                </div>

                <div class="action-buttons">
                    <a href="index.html" class="btn btn-back">← Back to Dashboard</a>
                    <button class="btn btn-report" onclick="generatePDFReport('${caseData.caseId}')">📄 Generate Report</button>
                </div>
            `;

            container.innerHTML = htmlContent;
        }

        function calculateDuration(created, closed) {
            if (!closed) return 'N/A';
            const [createdDate, createdTime] = created.split(' ');
            const [closedDate, closedTime] = closed.split(' ');
            const start = new Date(`${createdDate}T${createdTime}`);
            const end = new Date(`${closedDate}T${closedTime}`);
            const hours = Math.round((end - start) / (1000 * 60 * 60));
            return `${hours}h ${Math.round(((end - start) % (1000 * 60 * 60)) / (1000 * 60))}m`;
        }

        function generatePDFReport(caseId) {
            const cases = JSON.parse(localStorage.getItem('cases')) || [];
            const caseData = cases.find(c => c.caseId === caseId);
            
            if (!caseData) return;

            // Créer un élément HTML à convertir en PDF
            const reportHTML = `
                <div style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
                    <h1 style="color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px;">
                        Incident Report: ${caseData.caseId}
                    </h1>
                    
                    <h2 style="color: #34495e; margin-top: 20px;">Case Information</h2>
                    <table style="width: 100%; border-collapse: collapse;">
                        <tr style="background-color: #ecf0f1;">
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Case ID</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.caseId}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Title</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.title}</td>
                        </tr>
                        <tr style="background-color: #ecf0f1;">
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Type</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.type}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Severity</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>${caseData.severity}</strong></td>
                        </tr>
                        <tr style="background-color: #ecf0f1;">
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Status</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.status}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Created</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.created}</td>
                        </tr>
                        <tr style="background-color: #ecf0f1;">
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Source IP</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.sourceIp}</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;"><strong>Target User</strong></td>
                            <td style="padding: 8px; border: 1px solid #bdc3c7;">${caseData.targetUser}</td>
                        </tr>
                    </table>

                    <h2 style="color: #34495e; margin-top: 20px;">Investigation Progress</h2>
                    <ul>
                        <li><strong>Detection:</strong> ${caseData.checklist?.detection ? '✅ Complete' : '⭕ Pending'}</li>
                        <li><strong>Investigation:</strong> ${caseData.checklist?.investigation ? '✅ Complete' : '⭕ Pending'}</li>
                        <li><strong>Containment:</strong> ${caseData.checklist?.containment ? '✅ Complete' : '⭕ Pending'}</li>
                        <li><strong>Recovery:</strong> ${caseData.checklist?.recovery ? '✅ Complete' : '⭕ Pending'}</li>
                    </ul>

                    <h2 style="color: #34495e; margin-top: 20px;">Findings</h2>
                    <ul>
                        <li><strong>Successful Logins Detected:</strong> ${caseData.findings?.successful_logins ? 'Yes' : 'No'}</li>
                        <li><strong>Systems Affected:</strong> ${caseData.findings?.systems_affected}</li>
                        <li><strong>Threat Level:</strong> ${caseData.findings?.threat_level}</li>
                    </ul>

                    <h2 style="color: #34495e; margin-top: 20px;">Evidence Files</h2>
                    <ul>
                        ${caseData.evidence?.map(f => `<li>${f}</li>`).join('') || '<li>No evidence files</li>'}
                    </ul>

                    <hr style="margin-top: 30px; border: 1px solid #bdc3c7;">
                    <p style="color: #95a5a6; font-size: 0.9em; margin-top: 20px;">
                        Report generated from Case Management System<br>
                        Date: ${new Date().toLocaleString()}
                    </p>
                </div>
            `;

            const opt = {
                margin: 10,
                filename: `${caseData.caseId}-report.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(reportHTML).save();
        }
    </script>
</body>
</html>
