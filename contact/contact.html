<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - NCRC</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- adapte le chemin ci-dessus selon où est ton style.css par rapport à contact.html -->
</head>
<body>

  <!-- Ta navbar (copie-colle celle de ton index.html) -->
  <nav class="navbar">
    <!-- ... contenu de ta navbar ... -->
  </nav>

  <section id="contact" class="contact-section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">// SECURE_CHANNEL</span>
        <h2 class="section-title">Contactez le <span class="highlight">SOC</span></h2>
      </div>

      <div class="contact-wrapper">

        <div class="terminal-panel">
          <div class="terminal-header">
            <div class="terminal-dots">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
            </div>
            <span class="terminal-title">ncrc@secure-terminal:~$</span>
          </div>
          <div class="terminal-body">
            <p class="terminal-line"><span class="prompt">$</span> whoami</p>
            <p class="terminal-line output">NCRC — Numidia Cyber Resilience Corporation</p>
            <p class="terminal-line"><span class="prompt">$</span> status</p>
            <p class="terminal-line output success">
              <span class="status-dot"></span> CONNEXION SÉCURISÉE
            </p>
          </div>
        </div>

        <form id="ncrc-contact-form" action="https://formspree.io/f/xjykgbvz" method="POST">

          <div class="form-field">
            <input type="text" id="name" name="name" placeholder=" " required>
            <label for="name">Nom complet</label>
          </div>

          <div class="form-field">
            <input type="email" id="email" name="email" placeholder=" " required>
            <label for="email">Adresse email</label>
          </div>

          <div class="form-field">
            <input type="text" id="subject" name="subject" placeholder=" " required>
            <label for="subject">Sujet</label>
          </div>

          <div class="form-field">
            <textarea id="message" name="message" rows="5" placeholder=" " required></textarea>
            <label for="message">Message</label>
          </div>

          <button type="submit" id="submit-btn" class="btn-submit">
            <span class="btn-text">Envoyer le message</span>
          </button>

          <p id="form-message" class="message"></p>

        </form>
      </div>
    </div>
  </section>

  <script>
  document.getElementById('ncrc-contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('submit-btn');
    const messageEl = document.getElementById('form-message');

    btn.classList.add('loading');
    messageEl.textContent = '';
    messageEl.className = 'message';

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        messageEl.textContent = '> Message transmis avec succès. Réponse sous 24h.';
        messageEl.className = 'message success';
        form.reset();
      } else {
        throw new Error('Erreur');
      }
    } catch (error) {
      messageEl.textContent = '> Erreur de transmission. Réessayez.';
      messageEl.className = 'message error';
    } finally {
      btn.classList.remove('loading');
    }
  });
  </script>

</body>
</html>
